name: RepostGrid
options:
  bundleIdPrefix: com.repostgrid
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Repost Grid
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  RepostGrid:
    type: application
    platform: iOS
    sources:
      - RepostGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repostgrid.ios
        PRODUCT_NAME: RepostGrid
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
