name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "--- Список файлов в корне ---"
          ls -la

      - name: Build unsigned iOS app
        run: |
          # Ищем файл проекта
          PROJECT_FILE=$(find $GITHUB_WORKSPACE -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ ОШИБКА: Не найдено ни одного .xcodeproj файла!"
            exit 1
          fi
          
          PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          echo "✅ Найден проект: $PROJECT_NAME"
          echo "📍 Полный путь: $PROJECT_FILE"
          
          # Собираем приложение
          xcodebuild -project "$PROJECT_FILE" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -eo pipefail
          
          # Ищем собранный .app файл
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ ОШИБКА: Собранный .app файл не найден!"
            exit 1
          fi
          
          APP_NAME=$(basename "$APP_PATH")
          echo "✅ Найден .app файл: $APP_NAME"
          
          # Упаковываем в IPA
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" "build/ipa/Payload/$APP_NAME"
          cd build/ipa
          zip -qry ReportGrid-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReportGrid-unsigned-IPA
          path: build/ipa/ReportGrid-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
